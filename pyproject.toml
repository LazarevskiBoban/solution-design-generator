[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sdgen"
version = "0.1.0"
description = "Fill Office templates for solution-design documents"
requires-python = ">=3.12"
dependencies = [
    "python-pptx>=1.0",
    "pydantic>=2",
    "PyYAML>=6",
    "click>=8",
    "Jinja2>=3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
preview = ["pywin32; sys_platform == 'win32'"]
dev = ["pytest>=8"]

[project.scripts]
sdgen = "sdgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
