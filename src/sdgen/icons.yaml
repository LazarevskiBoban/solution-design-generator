# Icon catalogue for flow diagrams. Keys are what the model assigns to nodes. Files come from the SAP BTP
# Solution Diagrams repository (github.com/SAP/btp-solution-diagrams, Apache-2.0): service icons (*_sd.svg)
# from its svg folder, generic icons (generic-*.svg, SAP blue or non-SAP grey) from its draw.io library.
# `sdgen icons --fetch` downloads them into assets/icons/sap/ and builds the PNGs the drawings use.

# SAP systems and platforms
s4hana:
  label: SAP S/4HANA (any edition, RISE included)
  file: generic-building-sap.svg
