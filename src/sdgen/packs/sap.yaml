# Reference pack: the public reference architectures of one system. The planner offers a pack's entries to
# the model only when the brief matches `detect`; `sdgen refs --fetch` downloads the diagram sources named by
# `root` and `keep` from the repository into assets/refs/<system>/<id>/ for the conventions and the vocabulary.
system: sap
name: SAP Architecture Center
site: https://architecture.learning.sap.com/docs/ref-arch/
repo: SAP/architecture-center
branch: main
root: docs/ref-arch
